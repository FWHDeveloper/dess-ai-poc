version: '3.8'

services:
  # Moteur d'IA local (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: dess-ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama

  # Base de données vectorielle (PostgreSQL + Pgvector)
  vectordb:
    image: pgvector/pgvector:pg16
    container_name: dess-ai-vectordb
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=vector_db
      - POSTGRES_USER=soasyuser
      - POSTGRES_PASSWORD=soasypass
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Application Spring Boot (Compilation et exécution isolée Java 21)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dess-ai-backend
    ports:
      - "8080:8080"
    depends_on:
      - ollama
      - vectordb
    environment:
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
      - SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL=mistral
      - SPRING_DATASOURCE_URL=jdbc:postgresql://vectordb:5432/vector_db
      - SPRING_DATASOURCE_USERNAME=soasyuser
      - SPRING_DATASOURCE_PASSWORD=soasypass

volumes:
  ollama_storage:
  pgdata:
