apiVersion: apps/v1
kind: Deployment
metadata:
  name: dess-ai-backend
  namespace: soasy-prod
  labels:
    app: dess-ai-backend
spec:
  replicas: 3 # Haute disponibilité : 3 pods en parallèle
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1       # Lance une nouvelle version avant de couper l'ancienne
      maxUnavailable: 0 # Zéro coupure de service pendant la mise à jour
  selector:
    matchLabels:
      app: dess-ai-backend
  template:
    metadata:
      labels:
        app: dess-ai-backend
    spec:
      containers:
        - name: backend-container
          image: soasy-registry.azurecr.io/dess-ai-backend:v1.0.0
          ports:
            - containerPort: 8080
          # Sécurité : Limites de ressources matérielles
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: "500m"
              memory: 256Mi
          # Variables d'environnement dynamiques injectées en production
          env:
            - name: SPRING_AI_OLLAMA_BASE_URL
              value: "http://cluster.local"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://vectordb-service:5432/vector_db"
          # Autosécurisation (Self-Healing) : Redémarrage automatique via Actuator
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: dess-ai-backend-service
  namespace: soasy-prod
spec:
  type: ClusterIP # Routage interne sécurisé au sein du cluster
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: dess-ai-backend
